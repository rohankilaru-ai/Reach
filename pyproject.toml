[project]
name = "finger-processing"
version = "0.2.0"
description = "Camera -> curled/extended state and position of every finger, every frame"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mediapipe==1.2.3",
    "opencv-contrib-python==5.0.0.93",
    "numpy==2.4.6",
    "pydantic==2.14.3",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["finger_processing"]

[tool.setuptools.package-data]
finger_processing = ["config.yaml"]

[tool.pytest.ini_options]
testpaths = ["finger_processing", "hands_mode", "cursor_demo"]
pythonpath = ["."]
