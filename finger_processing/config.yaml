# Finger processing configuration. Relative paths are relative to this folder.

camera:
  index: 0
  width: 640
  height: 480
  fps: 60                 # requested; the MacBook Air camera delivers 30 (the HUD shows real fps)
  fourcc: MJPG
  buffer_size: 1
  exposure: null          # manual exposure value, or null for auto (often ignored on macOS)

tracker:
  model_path: hand_landmarker.task
  min_detection_confidence: 0.5
  min_presence_confidence: 0.5
  min_tracking_confidence: 0.5
  delegate: cpu           # cpu | gpu (measured about equal on this laptop)
  swap_handedness: false  # true flips MediaPipe's left/right label (verified by hand 2026-11-14: false is correct)

hands:
  max_hands: 2            # 1 or 2 (2 keeps MediaPipe's palm detector running while < 2 hands are seen)
  primary: left           # hand that drives the cursor and commands (frame.fingers, frame.pointer_screen, ...)
  primary_fallback: false # true: use the other hand when the primary is out of view
  handedness_vote_frames: 5
  handedness_vote_min: 3  # a new hand needs 3 of 5 matching left/right labels to lock to a side
  hold_frames: 3          # frames to hold a hand through a dropout
  swap_jump: 0.30         # wrist jump (normalized) that means a different hand
  swap_scale_ratio: 0.40  # hand-scale change in one frame that means a different hand

features:
  extend_angle_deg: 150   # middle-joint angle above which a finger counts as extended
  thumb_extend_ratio: 0.55
  pinch_enter: 0.25       # pinch_dist below this -> pinch down
  pinch_exit: 0.35        # pinch_dist above this -> pinch up
  pattern_hold_frames: 2  # curled/extended pattern must hold this long to fire a trigger

pointer:
  anchor: blend           # index_tip | index_mcp | blend
  blend_tip_weight: 0.5
  pinch_freeze_ms: 100    # hold the cursor still after a pinch edge

smoothing:                # One Euro filter, applied to every fingertip and the pointer
  min_cutoff: 1.0
  beta: 0.5
  d_cutoff: 1.0

gating:
  small_width: 160
  small_height: 120
  classify_motion: 0.04   # motion above this -> should_classify
  idle_motion: 0.02       # below this with no hand -> idle landmarker rate
  idle_after_s: 1.0
  idle_landmarker_hz: 5

calibration:
  path: calibration.json
  inset: 0.10
  dwell_s: 0.8
  still_speed: 0.05       # normalized units/s
  default_region: [0.2, 0.2, 0.8, 0.8]   # x0, y0, x1, y1 used when not calibrated

screen:
  width: null             # null = detect
  height: null

commands:                 # hand-gesture commands: idle / point / click (finger_processing/commands.py)
  decider: drex           # drex | heuristic. Drex decides from the streamed hand window; heuristic is the fallback
  drex_model: drex-max-v1.1
  max_rate_hz: 5          # Drex calls/s at most, plus one immediately when the finger pattern changes
  timeout_s: 0.8          # per call; on timeout/error the heuristic decides
  stale_s: 1.5            # no fresh Drex decision this long -> heuristic drives the mode
  window_frames: 10       # primary-hand frames per call (~330 ms)
  p_min: 0.70
  margin_min: 0.20
  point_hold_ms: 120      # hold the pointing pose this long before an index curl counts as a click
  click_curl_deg: 135     # index must bend below this angle to click (idle pointing flickers ~145-150). The status line shows each curl's min angle
  click_curl_frames: 1    # ... for this many consecutive frames
  click_curl_max_ms: 500  # ... within this long of leaving the pointing pose (a slow sag is not a click)
  drex_click_confirm_s: 1.0  # Drex click needs such a local curl within this many seconds
  click_cooldown_ms: 400
  pre_curl_ms: 120        # click where the cursor was this long before the curl started
  log_decisions: true     # Drex decisions -> .reach/logs/drex.jsonl (shown by `reach log`)

window_size: 10           # frames kept in FingerProcessor.window()
preview_hz: 20
