[project]
name = "reach-backend"
version = "0.1.0"
description = "Reach backend: Intern bridge, local WebSocket IPC, receipts and the Drex log"
requires-python = ">=3.12"
dependencies = [
    "intern-agent @ git+https://github.com/nace-ai/intern@v0.30.1",
    "nace-sdk",
    "websockets>=13",
]

[project.scripts]
reach = "reach.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reach"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
