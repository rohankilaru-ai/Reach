[project]
name = "reach-silent"
version = "0.1.0"
description = "Reach silent speech (EXPERIMENTAL, research weights): lip-reading -> 12-command hypotheses"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Light core: the typed --hyp path, rescoring and the bridge need only these.
    "numpy>=1.26",
    "websockets>=13",
]

[project.optional-dependencies]
# The recognizer. Pins follow github.com/Input-Labs-HQ/silent-chat requirements.txt (MIT). setup.sh installs these.
model = [
    "torch==2.15.0",
    "torchvision==0.29.2",
    "mediapipe==1.2.2",
    "opencv-contrib-python==5.0.0.93",
    "scikit-image==0.26.0",
    "scipy==1.17.1",
    "sentencepiece==0.2.3",
    "gdown==6.5.1",
    "pyobjc-framework-AVFoundation>=10.3",  # camera permission status without opening the camera
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reach_silent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = ["pytest>=8"]
