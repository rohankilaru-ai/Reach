[project]
name = "reach-perception"
version = "0.1.0"
description = "Reach camera worker: MediaPipe hand pointer and pinch selection (experimental)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mediapipe==1.2.2",  # PLAN.md S6 pin, shared with S8a; pulls opencv-contrib-python
    "numpy>=1.26",
    "websockets>=13",
    "pyobjc-framework-Vision>=10.3",
    "pyobjc-framework-Quartz>=10.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reach_perception"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = ["pytest>=8"]
