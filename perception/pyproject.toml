[project]
name = "reach-perception"
version = "0.1.0"
description = "Reach camera worker: MediaPipe hand pointer and pinch selection (experimental)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "finger-processing",  # repo root: the single camera + MediaPipe pipeline (pins mediapipe 1.2.3, opencv)
    "numpy>=1.26",
    "websockets>=13",
    "pyobjc-framework-Vision>=10.3",
    "pyobjc-framework-Quartz>=10.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reach_perception"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.sources]
finger-processing = { path = "..", editable = true }

[dependency-groups]
dev = ["pytest>=8"]
